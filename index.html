<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>Тренажёр: Определения → Термины</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{background:linear-gradient(145deg,#eef2f7,#d9e0e8);min-height:100vh;display:flex;justify-content:center;align-items:center;font-family:'Segoe UI','Inter',system-ui,sans-serif;padding:1rem}
    .trainer-card{max-width:1100px;width:100%;background:#fff;border-radius:1.5rem;box-shadow:0 20px 40px -12px rgba(0,0,0,.2);overflow:hidden}
    .trainer-container{padding:1rem 1.2rem 1.2rem}
    .table-header{display:grid;grid-template-columns:1fr 1fr;gap:.8rem;margin-bottom:1rem;border-bottom:2px solid #e6edf4;padding-bottom:.6rem}
    .header-cell{font-weight:600;font-size:.9rem;color:#1f2a3e;background:#f8fafd;padding:.4rem .6rem;border-radius:.8rem;text-align:center}
    .matching-grid{display:flex;flex-direction:column;gap:.5rem}
    .row-item{display:grid;grid-template-columns:1fr 1fr;gap:.8rem;align-items:stretch}
    .fixed-text-card{background:#fff;border:1.5px solid #95CAFA;border-radius:.8rem;padding:.5rem .8rem;display:flex;align-items:center;min-height:48px}
    .fixed-text-card span{font-size:.82rem;font-weight:500;color:#1f2a3e;line-height:1.35;word-break:break-word}
    .select-card{background:#fff;border:1.5px solid #95CAFA;border-radius:.8rem;padding:.2rem .6rem;display:flex;align-items:center}
    .elegant-select{width:100%;padding:.35rem 1.5rem .35rem .6rem;font-size:.78rem;font-family:'Segoe UI','Inter',sans-serif;font-weight:500;color:#1e2a3a;background:#fff;border:none;border-radius:.6rem;cursor:pointer;outline:none;line-height:1.3;white-space:normal;word-wrap:break-word;word-break:break-word;appearance:none;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='14' viewBox='0 0 24 24' fill='none' stroke='%23465a72' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><polyline points='6 9 12 15 18 9'></polyline></svg>");background-repeat:no-repeat;background-position:right .5rem center;background-size:.8rem}
    .elegant-select.placeholder-selected{color:#4a8bc2;font-weight:500}
    .elegant-select option{white-space:normal;word-wrap:break-word;word-break:break-word;padding:.3rem .5rem;font-size:.78rem;line-height:1.3;min-height:2rem}
    .elegant-select:focus{box-shadow:0 0 0 2px rgba(149,202,250,.25)}
    .check-button-wrapper{margin-top:1.2rem;display:flex;justify-content:center}
    .check-btn{background:#1f2a3e;border:none;padding:.5rem 1.8rem;font-size:.85rem;font-weight:600;font-family:inherit;color:#fff;border-radius:2rem;cursor:pointer;transition:.2s}
    .check-btn:hover{background:#2c3e5c;transform:translateY(-1px);box-shadow:0 6px 16px -4px rgba(0,0,0,.15)}
    .check-btn:active{transform:translateY(1px)}
    .message-area{margin-top:.8rem;text-align:center;font-size:.82rem;font-weight:500;min-height:2rem}
    .error-message{color:#d14545;background:#fff5f5;display:inline-block;padding:.3rem 1rem;border-radius:1.5rem;border:1px solid #f5c6c6}
    .success-message{color:#2a7a3b;background:#edf7f0;display:inline-block;padding:.3rem 1rem;border-radius:1.5rem;border:1px solid #b8e0c4}
    .row-correct .fixed-text-card,.row-correct .select-card{background-color:#e1f7e8;border-color:#2e8b57}
    .row-incorrect .fixed-text-card,.row-incorrect .select-card{background-color:#ffe6e6;border-color:#d14545}
    @media(max-width:700px){.trainer-container{padding:.6rem}.row-item{gap:.5rem}.header-cell{font-size:.78rem;padding:.3rem}.fixed-text-card span{font-size:.72rem}.elegant-select{font-size:.68rem;padding:.25rem 1.3rem .25rem .5rem}.elegant-select option{font-size:.68rem}}
  </style>
</head>
<body>
<div class="trainer-card">
  <div class="trainer-container">
    <div class="table-header">
      <div class="header-cell">Определение</div>
      <div class="header-cell">Термин</div>
    </div>
    <div class="matching-grid" id="matchingGrid"></div>
    <div class="check-button-wrapper">
      <button class="check-btn" id="checkBtn">Проверить</button>
    </div>
    <div class="message-area" id="messageArea"></div>
  </div>
</div>

<script>
  const trainingData=[
    {fixedInstruction:"Соглашение между сторонами, при котором каждая обязуется что-то сделать или передать.",options:["Договор","Актив по договору","Обязательство по договору","Доход","Продукция","Выручка","Цена сделки","Обязанность к исполнению","Цена обособленной продажи"],correctValue:"Договор"},
    {fixedInstruction:"Право компании получить оплату за работу, которую выполнили, или товар, который переделали, если это право зависит от выполнения будущих условий. Чтобы принять такой актив к учету, его нужно сначала идентифицировать п.12.",options:["Договор","Актив по договору","Обязательство по договору","Доход","Продукция","Выручка","Цена сделки","Обязанность к исполнению","Цена обособленной продажи"],correctValue:"Актив по договору"},
    {fixedInstruction:"Обязанность компании передать товар или оказать услугу, за которые она уже получила оплату или которые покупатель обязан оплатить.",options:["Договор","Актив по договору","Обязательство по договору","Доход","Продукция","Выручка","Цена сделки","Обязанность к исполнению","Цена обособленной продажи"],correctValue:"Обязательство по договору"},
    {fixedInstruction:"Увеличение экономических выгод в течение отчетного периода в форме поступлений или улучшения качества активов либо уменьшения величины обязательств, которое приводит к увеличению собственного капитала, не связанного с взносами участников капитала.",options:["Договор","Актив по договору","Обязательство по договору","Доход","Продукция","Выручка","Цена сделки","Обязанность к исполнению","Цена обособленной продажи"],correctValue:"Доход"},
    {fixedInstruction:"Товары, работы и услуги.",options:["Договор","Актив по договору","Обязательство по договору","Доход","Продукция","Выручка","Цена сделки","Обязанность к исполнению","Цена обособленной продажи"],correctValue:"Продукция"},
    {fixedInstruction:"Доход, который компания получает от своей основной деятельности.",options:["Договор","Актив по договору","Обязательство по договору","Доход","Продукция","Выручка","Цена сделки","Обязанность к исполнению","Цена обособленной продажи"],correctValue:"Выручка"},
    {fixedInstruction:"Сумма, которую компания ожидает получить от покупателя за товары или услуги, без учета сумм, которые она получает за третьих.",options:["Договор","Актив по договору","Обязательство по договору","Доход","Продукция","Выручка","Цена сделки","Обязанность к исполнению","Цена обособленной продажи"],correctValue:"Цена сделки"},
    {fixedInstruction:"Обещание в договоре передать покупателю товары или услугу, либо несколько одинаковых товаров или услуг, которые передаются по одному и тому же порядку.",options:["Договор","Актив по договору","Обязательство по договору","Доход","Продукция","Выручка","Цена сделки","Обязанность к исполнению","Цена обособленной продажи"],correctValue:"Обязанность к исполнению"},
    {fixedInstruction:"Цена, по которой компания продала бы покупателю обещанный товар или услугу по отдельности.",options:["Договор","Актив по договору","Обязательство по договору","Доход","Продукция","Выручка","Цена сделки","Обязанность к исполнению","Цена обособленной продажи"],correctValue:"Цена обособленной продажи"}
  ];

  function shuffleArray(a){const s=[...a];for(let i=s.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[s[i],s[j]]=[s[j],s[i]]}return s}

  const grid=document.getElementById('matchingGrid'),btn=document.getElementById('checkBtn'),msg=document.getElementById('messageArea');
  let selected=[],rows=[];

  function render(){
    grid.innerHTML='';rows=[];selected=[];
    trainingData.forEach((item,idx)=>{
      selected[idx]="";
      const row=document.createElement('div');row.className='row-item';row.dataset.rowIndex=idx;
      const left=document.createElement('div');left.className='fixed-text-card';
      const span=document.createElement('span');span.textContent=item.fixedInstruction;left.appendChild(span);
      const right=document.createElement('div');right.className='select-card';
      const sel=document.createElement('select');sel.className='elegant-select';sel.dataset.idx=idx;sel.style.width='100%';
      const ph=document.createElement('option');ph.value="";ph.textContent="— Выберите термин —";ph.disabled=true;ph.selected=true;ph.style.color="#4a8bc2";sel.appendChild(ph);
      shuffleArray(item.options).forEach(o=>{const opt=document.createElement('option');opt.value=o;opt.textContent=o;opt.style.whiteSpace='normal';opt.style.wordBreak='break-word';sel.appendChild(opt)});
      sel.classList.add('placeholder-selected');
      sel.addEventListener('change',e=>{
        const i=+e.target.dataset.idx,v=e.target.value;selected[i]=v;
        v===""?sel.classList.add('placeholder-selected'):sel.classList.remove('placeholder-selected');
        rows.forEach(r=>r.container.classList.remove('row-correct','row-incorrect'));
        msg.innerHTML='';
      });
      right.appendChild(sel);row.appendChild(left);row.appendChild(right);grid.appendChild(row);
      rows.push({container:row,select:sel,correctAnswer:item.correctValue,index:idx});
    });
  }

  function validate(){
    rows.forEach(r=>r.container.classList.remove('row-correct','row-incorrect'));
    let all=true;
    rows.forEach((r,i)=>{
      const u=selected[i],ok=u!==""&&u===r.correctAnswer;
      ok?(r.container.classList.add('row-correct')):(all=false,r.container.classList.add('row-incorrect'));
    });
    msg.innerHTML=all?'<div class="success-message">Вы правильно сопоставили термины с определениями!</div>':'<div class="error-message">Проверьте строки, которые подсвечены красным цветом.</div>';
  }

  function check(){rows.forEach((r,i)=>selected[i]=r.select.value);validate()}
  function init(){render();rows.forEach((r,i)=>selected[i]=r.select.value);msg.innerHTML=''}
  function bind(){const b=btn.cloneNode(true);btn.parentNode.replaceChild(b,btn);document.getElementById('checkBtn').addEventListener('click',check)}
  init();bind();
</script>
</body>
</html>
